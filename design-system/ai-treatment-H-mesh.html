<!doctype html><html><head><meta charset="utf-8"><title>AI card treatment 2</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#1C1D1F;--ink2:#5F636A;--ink3:#8A8E95;--hair:#E8E8EB;--s2:#F7F7F9;--acc:#3A7C57;--acch:#2F6547;--warn:#B45309}
*{box-sizing:border-box}body{margin:0;padding:28px;background:#fff;font:400 13px/20px Inter,sans-serif;font-feature-settings:"cv01","ss03";color:var(--ink)}
h1{font-size:14px;font-weight:600;margin:0 0 4px}.sub{color:var(--ink3);font-size:12px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 28px}.opt>h2{font-size:13px;font-weight:500;margin:0}.opt>p{margin:0 0 10px;font-size:12px;color:var(--ink2)}.opt>p a{color:var(--acc)}
svg{flex:none}.lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--acch)}
.card h3{font-size:14px;line-height:20px;font-weight:600;margin:2px 0 0}.card p{margin:0;color:var(--ink2)}
.strip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2)}.strip em{margin-left:auto;font-style:normal;color:var(--warn)}
.top{padding:0 16px;height:32px;border-bottom:1px solid #EFEFF2}.body{display:grid;gap:4px;padding:12px 16px 14px}
.fb,.fb2{display:flex;align-items:center;gap:2px;margin-top:6px;padding-left:4px;font-size:12px;color:var(--ink3)}.fb b{font-weight:400;margin-right:4px}.fb i,.fb2 i{flex:1}
.fb span,.pill span{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:6px}.fb .w{width:auto;padding:0 6px}
.g{border:1px solid #DCEBE2;border-radius:12px;background:#F2F8F4}.g .top{border-color:#DCEBE2}
.h{position:relative;border:1px solid var(--hair);border-radius:12px;background:linear-gradient(180deg,#E3F1E8 0,#F6FBF8 48px,#fff 110px)}.h .top{border-color:transparent}
.gsp svg{stroke:url(#gr)}
.i{border:1px solid var(--hair);border-radius:12px;background:#fff}.i .row{display:flex;align-items:center}.i .ttl{font-weight:600;font-size:13px}
.i .pw{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:#EEF6F1;color:var(--acch);font-size:11px;font-weight:500}.i .cap{font-size:12px;color:var(--ink3);margin-bottom:6px}
.j{display:grid;grid-template-columns:28px 1fr;gap:12px}.j .mark{width:28px;height:28px;border-radius:8px;background:#E3F0E8;color:var(--acch);display:flex;align-items:center;justify-content:center}
.j .who{font-size:12px;color:var(--ink3)}.j .who b{color:var(--ink);font-weight:500;margin-right:6px}.j .steps{display:grid;gap:2px;margin:4px 0 8px;font-size:12px;color:var(--ink3)}.j .steps span{display:flex;gap:6px;align-items:center}
.k{position:relative;border-radius:12px;background:#fff}.k::before{content:"";position:absolute;inset:0;border-radius:12px;padding:1.2px;background:linear-gradient(120deg,#3A7C57,#7CC4A0 30%,#C9E6A8 55%,#7FC8C0 80%,#3A7C57);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}.k .top{border-color:#EEF3F0}
.l{border:1px solid var(--hair);border-radius:12px;background:#fff}
.fb2{margin-top:8px}.fb2 .done{display:flex;align-items:center;gap:6px;color:var(--ink2)}.pill{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px 0 10px;border-radius:8px;background:var(--s2)}
</style><style>
.h.mesh{background:
 radial-gradient(120% 90px at 8% 0%, rgba(122,196,150,.2), transparent 70%),
 radial-gradient(80% 80px at 55% 0%, rgba(168,214,120,.15), transparent 70%),
 radial-gradient(70% 90px at 95% 0%, rgba(94,184,168,.17), transparent 72%),
 linear-gradient(180deg,#F7FBF9 0,#fff 100px);
 border-color:#E8F0EB}
.h.mesh .gsp svg{stroke:url(#gr2)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6547"/><stop offset=".5" stop-color="#5EB8A8"/><stop offset="1" stop-color="#8CC66E"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6547"/><stop offset="1" stop-color="#7CC4A0"/></linearGradient></defs></svg>
<div style="width:680px"><div class="opt"><div class="card h mesh"><div class="body" style="padding-top:14px"><span class="lbl"><span class="gsp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>AI summary</span><h3>Nothing reached her door. She needs it by Saturday.</h3><p>She wrote twice (chat 8:52, email 9:14). Both are merged here. The assistant already showed her the tracking and pulled the courier photo and GPS. Don't ask her for them again.</p></div></div><div class="fb"><b>Helpful?</b><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7A2 2 0 0 1 17.5 21H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></svg></span><span><svg style="transform:scale(1,-1)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7A2 2 0 0 1 17.5 21H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/></svg></span><i></i><span class="w">Hide</span></div></div></div></body></html>
